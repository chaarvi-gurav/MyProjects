<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satellite Pass Predictor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Satellite Pass Predictor</h1>

  <div id="controls">
    <label>Latitude: <input type="number" id="lat" value="37.7749" step="0.0001"></label>
    <label>Longitude: <input type="number" id="lon" value="-122.4194" step="0.0001"></label><br>
    <label>Date and Time:</label>
    <input
        type="datetime-local"
        id="predictionTime"
    >
    <label>Type of Satellite
      <select id="satelliteType">
        <option value="ISS">ISS</option>
        <option value="STARLINK">Starlink</option>
        <option value="NOAA">NOAA</option>
        <option value="GPS">GPS</option>
      </select>
    </label>
    <button id="loadBtn">Load ISS & Predict Passes</button>
  </div>

  <div id="map"></div>
  <div id="results"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> 
  <script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script> 
  <script src="script.js"></script>
</body>
</html>
